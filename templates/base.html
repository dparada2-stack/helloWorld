<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block page_title %}{% endblock %} | Daniel Parada</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- Shared navigation bar for every child page -->
    <nav class="navbar navbar-expand-sm navbar-dark bg-danger mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{{ url_for('about') }}">Daniel Parada</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                    aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('about') }}">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('favorite_course', subject='BMGT', course_number='407') }}">Favorite Course</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('contact') }}">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Page-specific content is filled in by child templates -->
    <main class="container">
        <h1 class="mb-4">{% block page_head %}{% endblock %}</h1>
        {% block page_content %}{% endblock %}
    </main>

    <footer class="container border-top mt-5 py-3 text-muted">
        <p class="mb-0">&copy; 2026 Daniel Parada &middot; BMGT407 Information Systems Projects</p>
    </footer>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
